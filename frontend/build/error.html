<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error | Mstatili Technologies</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #fafafa;
      color: #262626;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 700;
      color: #14b8a6;
      line-height: 1;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #262626;
      margin-bottom: 0.75rem;
    }

    .error-message {
      font-size: 1rem;
      color: #525252;
      max-width: 400px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #14b8a6;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.875rem;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: #0d9488;
    }

    .btn svg {
      width: 1rem;
      height: 1rem;
    }

    .footer {
      padding: 1.5rem;
      text-align: center;
      color: #737373;
      font-size: 0.875rem;
      border-top: 1px solid #e5e5e5;
    }

    .logo {
      margin-bottom: 2rem;
    }

    .logo img {
      height: 56px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <a href="/">
        <img src="/images/brand/mstatili-logo.png" alt="Mstatili Technologies">
      </a>
    </div>

    <div class="error-code" id="errorCode">Error</div>
    <h1 class="error-title" id="errorTitle">Something went wrong</h1>
    <p class="error-message" id="errorMessage">
      We're experiencing technical difficulties. Please try again in a moment.
    </p>

    <a href="/" class="btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
      Back to Home
    </a>
  </div>

  <footer class="footer">
    &copy; 2026 Mstatili Technologies. All rights reserved.
  </footer>

  <script>
    // Parse error code from URL or response
    const errorMessages = {
      400: { title: 'Bad Request', message: 'The request could not be understood. Please check and try again.' },
      401: { title: 'Unauthorized', message: 'You need to be logged in to access this resource.' },
      403: { title: 'Forbidden', message: 'You don\'t have permission to access this resource.' },
      404: { title: 'Page Not Found', message: 'The page you\'re looking for doesn\'t exist or has been moved.' },
      500: { title: 'Server Error', message: 'We\'re experiencing technical difficulties. Please try again later.' },
      502: { title: 'Bad Gateway', message: 'The server received an invalid response. Please try again later.' },
      503: { title: 'Service Unavailable', message: 'The service is temporarily unavailable. Please try again later.' },
      504: { title: 'Gateway Timeout', message: 'The server took too long to respond. Please try again later.' }
    };

    // Try to get error code from URL query param or default to generic
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || '';

    if (code && errorMessages[code]) {
      document.getElementById('errorCode').textContent = code;
      document.getElementById('errorTitle').textContent = errorMessages[code].title;
      document.getElementById('errorMessage').textContent = errorMessages[code].message;
    }
  </script>
</body>
</html>
