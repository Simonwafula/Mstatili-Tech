# =========================================================
# OpenLiteSpeed Proxy Configuration for FastAPI Backend
# Append this to: /usr/local/lsws/conf/vhosts/mstatilitechnologies.com/vhost.conf
# =========================================================

# External App - FastAPI Backend
  extprocessor mstatili_backend {
    type                    proxy
    address                 127.0.0.1:8000
    maxConns                100
    pcKeepAliveTimeout      60
    initTimeout             60
    retryTimeout            0
    respBuffer              0
  }

  # Proxy Context for /api/
  context /api/ {
    type                    proxy
    handler                 mstatili_backend
    addDefaultCharset       off
  }

  # Custom Error Pages
  errorpage 400 {
    url                     /error.html?code=400
  }

  errorpage 403 {
    url                     /error.html?code=403
  }

  errorpage 404 {
    url                     /error.html?code=404
  }

  errorpage 500 {
    url                     /error.html?code=500
  }

  errorpage 502 {
    url                     /error.html?code=502
  }

  errorpage 503 {
    url                     /error.html?code=503
  }

  errorpage 504 {
    url                     /error.html?code=504
  }
